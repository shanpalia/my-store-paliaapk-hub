<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126b4f"><title>Edit Company | My Store By PaliaAPK HUB"><style>body{font-family:Arial,sans-serif;margin:20px;color:#192a23;background:#fff}header{padding:12px;border-bottom:1px solid #ddd}main{display:block!important;max-width:900px;margin:24px auto}form{display:block!important;border:1px solid #ddd;padding:20px;margin-top:20px}input,textarea{display:block;width:95%;padding:10px;margin:6px 0 16px;border:1px solid #aaa}button,.btn{display:inline-block;padding:10px 14px;background:#126b4f;color:white;border:0;text-decoration:none;cursor:pointer}label{font-weight:bold} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="index.html">My Store <small>BY PALIAAPK HUB</small></a><span style="font-size:10px;color:#718076">COMPANY MASTER</span></header><main class="wrap"><div class="crumb"><a id="backLink" href="index.html">← Dashboard</a> / Company Name</div><div style="font-size:10px;letter-spacing:1.5px;color:var(--g);font-weight:850">COMPANY SETTINGS</div><h1>Edit Company Details</h1><p class="sub">Update the selected company's name, contact, address and business registration details. Your existing inventory remains linked to the same company ID.</p><form class="card" id="form"><div class="grid">
<div class="field full"><label for="name">Company / Store Name *</label><input id="name" required maxlength="100"></div>
<div><label for="businessType">Business Type</label><input id="businessType" maxlength="80"></div><div><label for="owner">Owner / Contact Person</label><input id="owner" maxlength="100"></div>
<div><label for="phone">Mobile / WhatsApp</label><input id="phone" maxlength="30" inputmode="tel"></div><div><label for="email">Business Email</label><input id="email" type="email" maxlength="120"></div>
<div class="field full"><label for="address">Address</label><textarea id="address" maxlength="500"></textarea></div>
<div><label for="city">City / Town</label><input id="city" maxlength="80"></div><div><label for="state">State</label><input id="state" maxlength="80"></div><div><label for="pincode">PIN Code</label><input id="pincode" maxlength="6" inputmode="numeric"></div><div><label for="country">Country</label><input id="country" maxlength="60"></div>
<div><label for="gstin">GSTIN</label><input id="gstin" maxlength="15" autocapitalize="characters"></div><div><label for="pan">PAN</label><input id="pan" maxlength="10" autocapitalize="characters"></div>
</div><div class="note">Company data is stored in this browser only. Editing the company profile does not change its ID or delete inventory/voucher history.</div><div class="msg" id="msg" role="status"></div><div class="actions"><a class="btn" id="cancel" href="index.html">Cancel</a><button class="btn primary" type="submit">Save Company Details</button></div></form></main>
<script>
(function(){
  'use strict';
  var KEY='myStorePaliaCompaniesV1';
  var $=function(id){return document.getElementById(id);};
  function showError(message){
    var form=$('form');
    if(form){form.innerHTML='<h2>Company page could not load</h2><p class="sub"></p><a class="btn primary" href="company.html">Open Company Selection</a>';form.querySelector('.sub').textContent=message;}
  }
  try {
    var id=new URLSearchParams(window.location.search).get('companyId');
    var all=[];
    try { all=JSON.parse(window.localStorage.getItem(KEY)||'[]'); } catch(e) { all=[]; }
    if(!Array.isArray(all)) all=[];
    var company=id?all.find(function(item){return String(item.id)===String(id);}):null;
    if(!company && all.length===1){company=all[0];id=String(company.id);}
    if(!company){
      var form=$('form');
      document.querySelector('h1').textContent='Select a Company';
      $('backLink').href='company.html';
      if(all.length){
        form.innerHTML='<h2>Choose the company to edit</h2><p class="sub">Select a company saved in this browser. Your existing inventory and company ID will be preserved.</p><div id="companyChoices" style="display:grid;gap:10px"></div><p class="msg" id="selectMessage" role="status"></p><a class="btn" href="company.html">Back to Company Selection</a>';
        var choices=$('companyChoices');
        all.forEach(function(item){
          var button=document.createElement('button');
          button.type='button'; button.className='btn'; button.style.textAlign='left'; button.style.padding='15px';
          button.textContent=(item.name||'Unnamed Company')+'  →  Edit details';
          button.addEventListener('click',function(){window.location.href='company-edit.html?companyId='+encodeURIComponent(item.id);});
          choices.appendChild(button);
        });
      } else {
        form.innerHTML='<h2>No company found in this browser</h2><p class="sub">Create or select your company first. If you already created one, make sure you are using the same browser profile and website address.</p><a class="btn primary" href="company.html">Open Company Selection</a>';
      }
      return;
    }
    ['name','businessType','owner','phone','email','address','city','state','pincode','country','gstin','pan'].forEach(function(key){if($(key)) $(key).value=company[key]||'';});
    $('backLink').href='index.html?companyId='+encodeURIComponent(company.id);
    $('cancel').href=$('backLink').href;
    $('form').addEventListener('submit',function(event){
      event.preventDefault();
      var name=$('name').value.trim();
      if(!name){$('msg').textContent='Company name is required.';$('name').focus();return;}
      var email=$('email').value.trim();
      if(email && !$('email').checkValidity()){$('msg').textContent='Enter a valid email address or leave it blank.';return;}
      var index=all.findIndex(function(item){return String(item.id)===String(id);});
      if(index<0){$('msg').textContent='Company record not found. Please select the company again.';return;}
      all[index]=Object.assign({},all[index],{
        name:name,businessType:$('businessType').value.trim(),owner:$('owner').value.trim(),
        phone:$('phone').value.trim(),email:email,address:$('address').value.trim(),
        city:$('city').value.trim(),state:$('state').value.trim(),pincode:$('pincode').value.trim(),
        country:$('country').value.trim(),gstin:$('gstin').value.trim().toUpperCase(),
        pan:$('pan').value.trim().toUpperCase(),updatedAt:new Date().toISOString()
      });
      try { window.localStorage.setItem(KEY,JSON.stringify(all));window.location.href='index.html?companyId='+encodeURIComponent(id); }
      catch(error){$('msg').textContent='Could not save changes. Please check browser storage settings.';}
    });
  } catch(error) {
    showError('Please return to the dashboard and open Company again. Details: '+(error&&error.message?error.message:'Unknown error'));
  }
})();
</script></body></html>
