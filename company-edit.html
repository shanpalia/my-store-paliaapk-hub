<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126b4f"><title>Edit Company | My Store By PaliaAPK HUB"><style>
:root{--g:#126b4f;--mint:#eaf6ef;--ink:#192a23;--muted:#718076;--line:#e3e9e3}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:800;color:var(--g);text-decoration:none}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.wrap{width:min(900px,calc(100% - 28px));margin:28px auto}.crumb{font-size:12px;margin-bottom:18px}.crumb a{color:var(--g)}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}.sub{color:var(--muted);font-size:12px;line-height:1.7}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;margin-bottom:7px}input,select,textarea{width:100%;padding:12px;border:1px solid #dce5dc;border-radius:9px;background:#fff;font-size:12px}textarea{min-height:75px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px 16px;font-size:12px;font-weight:750;text-decoration:none;color:var(--ink)}.primary{background:var(--g);color:white;border-color:var(--g)}.msg{font-size:12px;color:#b0473e;margin-top:12px}.note{background:var(--mint);border-radius:10px;padding:12px;font-size:11px;color:#35664c;line-height:1.6;margin-top:15px}@media(max-width:560px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:16px}.top{padding:0 14px}.wrap{margin-top:20px}}
</style></head><body><header class="top"><a class="brand" href="index.html">My Store <small>BY PALIAAPK HUB</small></a><span style="font-size:10px;color:#718076">COMPANY MASTER</span></header><main class="wrap"><div class="crumb"><a id="backLink" href="index.html">← Dashboard</a> / Company Name</div><div style="font-size:10px;letter-spacing:1.5px;color:var(--g);font-weight:850">COMPANY SETTINGS</div><h1>Edit Company Details</h1><p class="sub">Update the selected company's name, contact, address and business registration details. Your existing inventory remains linked to the same company ID.</p><form class="card" id="form"><div class="grid">
<div class="field full"><label for="name">Company / Store Name *</label><input id="name" required maxlength="100"></div>
<div><label for="businessType">Business Type</label><input id="businessType" maxlength="80"></div><div><label for="owner">Owner / Contact Person</label><input id="owner" maxlength="100"></div>
<div><label for="phone">Mobile / WhatsApp</label><input id="phone" maxlength="30" inputmode="tel"></div><div><label for="email">Business Email</label><input id="email" type="email" maxlength="120"></div>
<div class="field full"><label for="address">Address</label><textarea id="address" maxlength="500"></textarea></div>
<div><label for="city">City / Town</label><input id="city" maxlength="80"></div><div><label for="state">State</label><input id="state" maxlength="80"></div><div><label for="pincode">PIN Code</label><input id="pincode" maxlength="6" inputmode="numeric"></div><div><label for="country">Country</label><input id="country" maxlength="60"></div>
<div><label for="gstin">GSTIN</label><input id="gstin" maxlength="15" autocapitalize="characters"></div><div><label for="pan">PAN</label><input id="pan" maxlength="10" autocapitalize="characters"></div>
</div><div class="note">Company data is stored in this browser only. Editing the company profile does not change its ID or delete inventory/voucher history.</div><div class="msg" id="msg" role="status"></div><div class="actions"><a class="btn" id="cancel" href="index.html">Cancel</a><button class="btn primary" type="submit">Save Company Details</button></div></form></main>
<script>
(()=>{'use strict';const KEY='myStorePaliaCompaniesV1';const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('companyId');let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(all))all=[]}catch{all=[]}const c=all.find(x=>String(x.id)===String(id));if(!c){document.querySelector('form').innerHTML='<h2>No active company selected</h2><p class="sub">Open a company first, then choose Company Name from the dashboard menu.</p><a class="btn primary" href="company.html">Select Company</a>';throw new Error('No company selected')};['name','businessType','owner','phone','email','address','city','state','pincode','country','gstin','pan'].forEach(k=>{if($(k))$(k).value=c[k]||''});$('backLink').href='index.html?companyId='+encodeURIComponent(c.id);$('cancel').href=$('backLink').href;$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim();if(!name){$('msg').textContent='Company name is required.';$('name').focus();return}const email=$('email').value.trim();if(email&&!$('email').checkValidity()){$('msg').textContent='Enter a valid email address or leave it blank.';return}const idx=all.findIndex(x=>String(x.id)===String(id));all[idx]={...all[idx],name,businessType:$('businessType').value.trim(),owner:$('owner').value.trim(),phone:$('phone').value.trim(),email,address:$('address').value.trim(),city:$('city').value.trim(),state:$('state').value.trim(),pincode:$('pincode').value.trim(),country:$('country').value.trim(),gstin:$('gstin').value.trim().toUpperCase(),pan:$('pan').value.trim().toUpperCase(),updatedAt:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(all));location.href='index.html?companyId='+encodeURIComponent(id)}catch(err){$('msg').textContent='Could not save changes. Browser storage may be unavailable.'}})})();
</script></body></html>
