<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126b4f"><title>Payment Voucher | My Store By PaliaAPK HUB"><style>
:root{--g:#126b4f;--mint:#eaf6ef;--ink:#192a23;--muted:#718076;--line:#e3e9e3;--red:#b0473e}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:800;color:var(--g);text-decoration:none}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.wrap{width:min(1150px,calc(100% - 28px));margin:28px auto}.crumb{font-size:12px;margin-bottom:18px}.crumb a{color:var(--g)}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--g);font-weight:850}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}.sub{color:var(--muted);font-size:12px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:13px}.stat{padding:17px}.stat small{color:var(--muted);font-size:10px}.stat strong{display:block;font-size:22px;margin-top:9px}.card{padding:20px;margin-bottom:18px}.card h2{font-size:15px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.field.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:800;margin-bottom:7px}input,select,textarea{width:100%;padding:11px;border:1px solid #dce5dc;border-radius:9px;background:white;font-size:12px}textarea{min-height:64px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 15px;font-size:11px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:white;border-color:var(--g)}.msg{font-size:11px;color:var(--red);margin-top:10px;min-height:14px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf1ed;font-size:11px}th{background:#fafcf9;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.5px}.tag{display:inline-block;padding:5px 8px;border-radius:30px;background:var(--mint);color:var(--g);font-size:9px;font-weight:800}.tag.payment{background:#fce9e7;color:var(--red)}.empty{text-align:center;padding:28px;color:var(--muted);font-size:12px}.tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.tools input{max-width:300px}.danger{color:var(--red)}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:1fr}.tools{align-items:stretch;flex-direction:column}.tools input{max-width:none}}@media(max-width:480px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:14px}.top{padding:0 14px}.wrap{margin-top:20px}}
</style></head><body><header class="top"><a class="brand" id="brand" href="index.html">My Store <small>BY PALIAAPK HUB</small></a><span style="font-size:10px;color:#718076">ACCOUNTS · CASH / BANK</span></header><main class="wrap"><div class="crumb"><a id="back" href="index.html">← Dashboard</a> / Payment Voucher</div><div class="eyebrow">ACCOUNTS TRANSACTIONS</div><h1>Payment Voucher</h1><p class="sub">Record payments made by the selected company. Entries are saved in this browser and can be printed or exported.</p>
<div class="stats"><div class="stat"><small>Total Receipts</small><strong id="totalReceipt">₹0.00</strong></div><div class="stat"><small>Total Payments</small><strong id="totalPayment">₹0.00</strong></div><div class="stat"><small>Net Cash Movement</small><strong id="net">₹0.00</strong></div></div>
<section class="card"><h2>New transaction</h2><form id="form"><div class="grid"><div><label for="type">Transaction Type *</label><select id="type"><option value="PAYMENT">Payment — money paid</option></select></div><div><label for="date">Date *</label><input id="date" type="date" required></div><div><label for="amount">Amount (₹) *</label><input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div><label for="method">Mode</label><select id="method"><option>Cash</option><option>Bank Transfer</option><option>UPI</option><option>Cheque</option><option>Card</option><option>Other</option></select></div><div><label for="party">Party / Account *</label><input id="party" maxlength="120" required placeholder="Customer, supplier or account"></div><div><label for="ref">Reference / Receipt No.</label><input id="ref" maxlength="80" placeholder="Optional reference"></div><div class="field full"><label for="note">Narration</label><textarea id="note" maxlength="300" placeholder="Purpose / details"></textarea></div></div><div class="msg" id="msg" role="status"></div><div class="actions"><button class="btn primary" type="submit">Save Transaction</button></div></form></section>
<section class="card"><div class="tools"><div><h2 style="margin:0 0 5px">Transaction register</h2><div class="sub" style="margin:0">Only payment vouchers saved for this company are shown.</div></div><input id="search" type="search" placeholder="Search party, type or reference"></div><div id="table"></div><div class="actions"><button class="btn" id="export">Export CSV</button><button class="btn" id="print">Print Register</button></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const companyId=new URLSearchParams(location.search).get('companyId');let company;try{company=(JSON.parse(localStorage.getItem('myStorePaliaCompaniesV1')||'[]')||[]).find(c=>String(c.id)===String(companyId))}catch{}if(!company){document.querySelector('main').innerHTML='<h1>No company selected</h1><p class="sub">Please open your company from the dashboard first.</p><a href="company.html">Select Company</a>';return}const key='myStorePaymentReceiptsV1_'+company.id;let rows=[];try{const x=JSON.parse(localStorage.getItem(key)||'[]');rows=Array.isArray(x)?x:[]}catch{}const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});const nextVoucherNo=type=>{const prefix=type==='PAYMENT'?'PV':'RV';const n=rows.filter(r=>r.type===type).length+1;return prefix+'-'+String(n).padStart(5,'0')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('brand').href='index.html?companyId='+encodeURIComponent(company.id);$('back').href=$('brand').href;$('date').value=new Date().toISOString().slice(0,10);const initialType=new URLSearchParams(location.search).get('type');if(initialType==='PAYMENT'||initialType==='RECEIPT')$('type').value=initialType;function save(){localStorage.setItem(key,JSON.stringify(rows))}function render(){const receipt=0,payment=rows.filter(r=>r.type==='PAYMENT').reduce((s,r)=>s+Number(r.amount),0);$('totalReceipt').textContent=money(receipt);$('totalPayment').textContent=money(payment);$('net').textContent=money(receipt-payment);const q=$('search').value.trim().toLowerCase(),list=rows.filter(r=>[r.type,r.date,r.party,r.ref,r.method,r.note].join(' ').toLowerCase().includes(q)).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));$('table').innerHTML=list.length?'<div class="table-wrap"><table><thead><tr><th>Voucher No.</th><th>Date</th><th>Type</th><th>Party / Account</th><th>Mode</th><th>Reference</th><th>Narration</th><th>Amount</th><th>Action</th></tr></thead><tbody>'+list.map(r=>'<tr><td><b>'+esc(r.voucherNo||((r.type==='PAYMENT'?'PV':'RV')+'—'))+'</b></td><td>'+esc(r.date)+'</td><td><span class="tag '+(r.type==='PAYMENT'?'payment':'')+'">'+(r.type==='PAYMENT'?'Payment':'Receipt')+'</span></td><td>'+esc(r.party)+'</td><td>'+esc(r.method)+'</td><td>'+esc(r.ref||'—')+'</td><td>'+esc(r.note||'—')+'</td><td><b>'+money(r.amount)+'</b></td><td><button class="btn danger" data-delete="'+esc(r.id)+'">Delete</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No payment or receipt entries yet.</div>'} $('form').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value),party=$('party').value.trim();if(!party||!Number.isFinite(amount)||amount<=0){$('msg').textContent='Enter a party/account and an amount greater than zero.';return}const transactionType='PAYMENT';rows.push({id:'pr_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),voucherNo:nextVoucherNo(transactionType),type:transactionType,date:$('date').value,amount,method:$('method').value,party,ref:$('ref').value.trim(),note:$('note').value.trim(),createdAt:new Date().toISOString()});try{save();$('form').reset();$('date').value=new Date().toISOString().slice(0,10);$('msg').textContent='Transaction saved.';render()}catch(err){rows.pop();$('msg').textContent='Could not save. Browser storage may be unavailable.'}});$('search').addEventListener('input',render);$('table').addEventListener('click',e=>{const b=e.target.closest('[data-delete]');if(!b)return;if(confirm('Delete this transaction?')){rows=rows.filter(r=>r.id!==b.dataset.delete);save();render()}});$('export').addEventListener('click',()=>{const csv='\ufeff'+[['Voucher No','Date','Party','Mode','Reference','Narration','Amount'],...rows.filter(r=>r.type==='PAYMENT').map(r=>[r.voucherNo,r.date,r.party,r.method,r.ref,r.note,r.amount])].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='payment-receipt-'+company.id+'.csv';a.click();URL.revokeObjectURL(a.href)});$('print').addEventListener('click',()=>window.print());render()})();
</script></body></html>
