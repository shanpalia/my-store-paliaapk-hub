<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126b4f">
<title>Purchase | My Store By PaliaAPK HUB</title><link rel="stylesheet" href="page.css">
<style>
.purchase-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.purchase-grid .field{min-width:0}.field-with-add{display:flex;align-items:flex-end;gap:6px}.field-with-add>div{flex:1;min-width:0}.plus-btn{width:40px;height:40px;flex:0 0 40px;border:1px solid #b9e2d1;background:#edf8f3;color:#126b4f;border-radius:8px;font-size:23px;line-height:1;cursor:pointer}.purchase-lines .edit-btn{padding:6px 10px;white-space:nowrap}.purchase-grid input,.purchase-grid select,.purchase-grid textarea{width:100%;box-sizing:border-box}.purchase-lines{overflow-x:auto}.purchase-lines table{min-width:760px}.purchase-lines input,.purchase-lines select{width:100%;min-width:90px;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:inherit}.purchase-lines .amount{text-align:right;white-space:nowrap}.purchase-summary{display:flex;justify-content:flex-end;gap:20px;align-items:center;flex-wrap:wrap;padding:16px 0}.purchase-summary strong{font-size:22px;color:#126b4f}.action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.notice{padding:12px 14px;border-radius:9px;background:#edf8f3;color:#126b4f;margin-bottom:14px}.error{color:#b42318;margin:10px 0}.muted{color:var(--muted,#68746f)}@media(max-width:800px){.purchase-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.purchase-grid{grid-template-columns:1fr}.purchase-summary{justify-content:space-between}}
.purchase-actions{white-space:nowrap;min-width:150px}.purchase-actions .delete-btn{background:#fff1f0!important;color:#b42318!important;border-color:#f3b8b5!important;padding:9px 10px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}.purchase-actions .edit-btn{background:#126b4f!important;color:#fff!important;border-color:#126b4f!important;padding:9px 12px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}\n</style>
</head>
<body data-page="purchase">
<header class="topbar"><a class="brand" href="index.html"><span class="logo">MS</span><span><strong>My Store By PaliaAPK HUB</strong><small>Inventory &amp; Accounts Workspace</small></span></a><div class="company">ACTIVE COMPANY<br><strong id="companyName">—</strong></div></header>
<div class="layout"><aside><div class="caption">WORKSPACE MENU</div>
<a class="nav" data-link="index.html" href="index.html"><span>▦</span>Dashboard</a><a class="nav" data-link="accounts.html" href="accounts.html"><span>₹</span>Accounts</a><a class="nav" data-link="items.html" href="items.html"><span>▤</span>Items</a><a class="nav active" data-link="purchase.html" href="purchase.html"><span>↓</span>Purchase</a><a class="nav" data-link="sale.html" href="sale.html"><span>↑</span>Sale</a><a class="nav" data-link="balance.html" href="balance.html"><span>≡</span>Balance</a><a class="nav" data-link="vouchers.html" href="vouchers.html"><span>⇄</span>Vouchers</a><a class="nav" data-link="reports.html" href="reports.html"><span>▥</span>Reports</a>
</aside><main id="pageContent"><div class="panel"><div class="empty">Loading purchase data…</div></div></main></div>
<footer class="foot">My Store By PaliaAPK HUB · Inventory data is stored in this browser.</footer>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),companyKey='myStorePaliaCompaniesV1';
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>Number.isFinite(Number(n))?Number(n):0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let companies=[];try{companies=JSON.parse(localStorage.getItem(companyKey)||'[]')}catch{}
const company=companies.find(c=>String(c.id)===params.get('companyId'));
if(!company){$('pageContent').innerHTML='<div class="panel"><div class="empty"><strong>Company select karein</strong><p>Pehle Dashboard se company workspace kholein, phir Purchase par aayein.</p><a class="btn primary" href="index.html">Open Company Selection</a></div></div>';return}
const storageKey='myStoreInventoryV1_'+company.id;let data={items:[],vouchers:[],accounts:[]};
try{data=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
data.items=Array.isArray(data.items)?data.items:[];data.vouchers=Array.isArray(data.vouchers)?data.vouchers:[];data.accounts=Array.isArray(data.accounts)?data.accounts:[];
const save=()=>localStorage.setItem(storageKey,JSON.stringify(data));
$('companyName').textContent=company.name;
document.querySelectorAll('[data-link]').forEach(a=>a.href=a.dataset.link+'?companyId='+encodeURIComponent(company.id));
function voucherRows(){return data.vouchers.filter(v=>v.type==='IN').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||'')).map(v=>'<tr><td>'+esc(v.date||'—')+'</td><td>'+esc(v.voucherNo||'—')+'</td><td><strong>'+esc(v.itemName||'—')+'</strong><br><small>'+esc(v.unit||'')+'</small></td><td>'+esc(v.party||'—')+'</td><td>'+num(v.qty)+'</td><td>'+money(v.rate)+'</td><td>'+money(num(v.qty)*num(v.rate))+'</td><td>'+esc(v.note||'—')+'</td><td class="purchase-actions"><button class="btn edit-btn" data-purchase-edit="'+esc(v.id)+'">Edit</button> <button class="btn delete-btn" data-purchase-delete="'+esc(v.id)+'">Delete</button></td></tr>').join('')}
function bindPurchaseActions(){document.querySelectorAll('#purchaseRows [data-purchase-edit]').forEach(b=>{b.onclick=()=>editPurchaseLine(b.getAttribute('data-purchase-edit'))});document.querySelectorAll('#purchaseRows [data-purchase-delete]').forEach(b=>{b.onclick=()=>deletePurchaseLine(b.getAttribute('data-purchase-delete'))})}
function render(){const purchaseVouchers=data.vouchers.filter(v=>v.type==='IN');const total=purchaseVouchers.reduce((s,v)=>s+num(v.qty)*num(v.rate),0);
$('pageContent').innerHTML='<div class="heading"><div><div class="eyebrow">STOCK IN · VOUCHERS</div><h1>Purchase</h1><p>Record supplier purchases and automatically update stock for '+esc(company.name)+'.</p></div><div class="action-row"><button class="btn" id="exportPurchase">Export CSV</button><button class="btn primary" id="newPurchase">＋ New Purchase</button></div></div><div class="stats"><div class="stat"><small>Purchase Entries</small><strong>'+purchaseVouchers.length+'</strong></div><div class="stat"><small>Total Purchase Value</small><strong>'+money(total)+'</strong></div><div class="stat"><small>Stock Items</small><strong>'+data.items.length+'</strong></div><div class="stat"><small>Suppliers / Accounts</small><strong>'+data.accounts.length+'</strong></div></div><div id="purchaseFormPanel"></div><div class="panel"><div class="panel-head"><div><h2>Purchase Register</h2><p>Saved purchase item lines · newest first</p></div><input id="purchaseSearch" placeholder="Search voucher / item / supplier" style="padding:9px;border:1px solid var(--line);border-radius:8px;max-width:280px"></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Voucher No.</th><th>Item</th><th>Supplier / Party</th><th>Qty</th><th>Rate</th><th>Amount</th><th>Narration</th><th>Actions</th></tr></thead><tbody id="purchaseRows">'+voucherRows()+'</tbody></table></div><div id="purchaseEmpty" class="empty" style="display:'+(purchaseVouchers.length?'none':'block')+'"><strong>No purchase entries yet</strong>Click “New Purchase” to record the first purchase.</div></div>';
$('newPurchase').onclick=showForm;$('exportPurchase').onclick=exportCSV;bindPurchaseActions();$('purchaseSearch').addEventListener('input',()=>{const q=$('purchaseSearch').value.toLowerCase();const found=data.vouchers.filter(v=>v.type==='IN'&&[v.date,v.voucherNo,v.itemName,v.party,v.note].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));$('purchaseRows').innerHTML=found.map(v=>'<tr><td>'+esc(v.date||'—')+'</td><td>'+esc(v.voucherNo||'—')+'</td><td><strong>'+esc(v.itemName||'—')+'</strong><br><small>'+esc(v.unit||'')+'</small></td><td>'+esc(v.party||'—')+'</td><td>'+num(v.qty)+'</td><td>'+money(v.rate)+'</td><td>'+money(num(v.qty)*num(v.rate))+'</td><td>'+esc(v.note||'—')+'</td><td class="purchase-actions"><button class="btn edit-btn" data-purchase-edit="'+esc(v.id)+'">Edit</button> <button class="btn delete-btn" data-purchase-delete="'+esc(v.id)+'">Delete</button></td></tr>').join('');$('purchaseEmpty').style.display=found.length?'none':'block';$('purchaseEmpty').innerHTML='<strong>No purchase entries found</strong>Search ko badal kar dekhein.';bindPurchaseActions()})}
let activeEditId=null;function showForm(editId=null,draft=null){activeEditId=editId;const editVoucher=editId?data.vouchers.find(x=>String(x.id)===String(editId)&&x.type==='IN'):null;if(editId&&!editVoucher){alert('Purchase entry nahi mili.');return}if(!data.items.length){$('purchaseFormPanel').innerHTML='<div class="panel"><div class="empty"><strong>Pehle item banayein</strong><p>Purchase entry karne se pehle stock item create karein.</p><a class="btn primary" href="add-item.html?companyId='+encodeURIComponent(company.id)+'&returnTo=purchase">＋ Add New Item</a></div></div>';return}
const suppliers=data.accounts.filter(a=>/supplier|creditor/i.test(a.group||''));
const accountOptions=data.accounts.map(a=>'<option value="'+esc(a.name)+'">'+esc(a.name)+(a.group?' · '+esc(a.group):'')+'</option>').join('');
const itemOptions=data.items.map(i=>'<option value="'+esc(i.id)+'">'+esc(i.name)+' · stock '+num(i.qty)+' '+esc(i.unit||'pcs')+'</option>').join('');
const suggested='PUR-'+String(data.vouchers.filter(v=>v.type==='IN').length+1).padStart(5,'0');
$('purchaseFormPanel').innerHTML='<div class="panel"><div class="panel-head"><div><h2>'+(editVoucher?'Edit Purchase Voucher':'New Purchase Voucher')+'</h2><p>'+(editVoucher?'Purchase details badlein aur Save Changes karein.':'Supplier invoice details and one or more stock item lines.')+'</p></div><button class="btn" type="button" id="closePurchaseForm">Close</button></div><form id="purchaseForm"><div class="purchase-grid"><div class="field"><label for="purchaseDate">Date *</label><input id="purchaseDate" name="date" type="date" required value="'+esc(editVoucher?.date||today())+'"></div><div class="field"><label for="purchaseNo">Voucher / Invoice No. *</label><input id="purchaseNo" name="voucherNo" required maxlength="50" value="'+esc(editVoucher?.voucherNo||suggested)+'"></div><div class="field field-with-add"><div><label for="purchaseParty">Supplier / Party</label><input id="purchaseParty" name="party" list="supplierOptions" maxlength="120" placeholder="Type or select supplier" value="'+esc(editVoucher?.party||'')+'"><datalist id="supplierOptions">'+accountOptions+'</datalist></div><button class="plus-btn" type="button" id="quickAddAccount" title="Add account" aria-label="Add account">+</button></div><div class="field"><label for="purchaseNote">Narration</label><input id="purchaseNote" name="note" maxlength="250" placeholder="Invoice note / details" value="'+esc(editVoucher?.note||'')+'"></div></div><div class="purchase-lines" style="margin-top:18px"><table><thead><tr><th style="width:32%">Item * <span class="muted">(+ to add)</span></th><th>Available Qty</th><th style="width:14%">Quantity *</th><th style="width:17%">Rate (₹) Auto</th><th style="width:19%">Amount (₹) *</th><th></th></tr></thead><tbody id="purchaseLineRows"></tbody></table></div><div class="action-row" style="margin-top:12px"><button class="btn" type="button" id="addPurchaseLine">＋ Add Item Row</button></div><div class="purchase-summary"><span>Total Purchase</span><strong id="purchaseGrandTotal">₹0.00</strong></div><div class="error" id="purchaseError" role="alert"></div><div class="action-row"><button class="btn" type="button" id="cancelPurchase">Cancel</button><button class="btn primary" type="submit">'+(editVoucher?'Save Changes':'Save Purchase')+'</button></div></form></div>';
const form=$('purchaseForm'),body=$('purchaseLineRows');
function addLine(itemId='',qty='',rate=''){
const initialAmount=(num(qty)*num(rate)).toFixed(2);
const tr=document.createElement('tr');
tr.innerHTML='<td><div class="field-with-add"><div><select class="line-item" required><option value="">Select item</option>'+itemOptions+'</select></div><button type="button" class="plus-btn quick-add-item" title="Add item" aria-label="Add item">+</button></div></td><td class="line-stock">—</td><td><input class="line-qty" type="number" min="0.001" step="any" required value="'+qty+'" placeholder="Qty"></td><td><input class="line-rate" type="number" min="0" step="0.01" required value="'+rate+'" placeholder="Enter rate" aria-label="Rate"></td><td><input class="line-amount-input" type="number" min="0" step="0.01" required value="'+initialAmount+'" placeholder="Enter amount"></td><td><button type="button" class="btn line-remove" aria-label="Remove row">×</button></td>';
body.appendChild(tr);
tr.querySelector('.quick-add-item').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();quickAddItem(tr)});
const sel=tr.querySelector('.line-item'),q=tr.querySelector('.line-qty'),r=tr.querySelector('.line-rate'),amt=tr.querySelector('.line-amount-input');
amt.dataset.manual='no';
if(itemId)sel.value=itemId;
function updateTotals(){
const item=data.items.find(i=>i.id===sel.value);
tr.querySelector('.line-stock').textContent=item?num(item.qty)+' '+(item.unit||'pcs'):'—';
const quantity=num(q.value),amount=num(amt.value);
if(amt.dataset.manual==='yes'){r.value=quantity>0?(amount/quantity).toFixed(2):'0.00'}else if(quantity>0){r.value=(amount/quantity).toFixed(2)}
let total=0;
body.querySelectorAll('tr').forEach(row=>total+=num(row.querySelector('.line-amount-input').value));
$('purchaseGrandTotal').textContent=money(total);
}
function applyRateToAmount(){
const quantity=num(q.value),currentRate=num(r.value);
amt.dataset.manual='no';
amt.value=(quantity*currentRate).toFixed(2);
updateTotals();
}
function applyAmountToRate(){
amt.dataset.manual='yes';
updateTotals();
}
sel.addEventListener('change',()=>{
const item=data.items.find(i=>i.id===sel.value);
if(item){r.value=num(item.purchaseRate).toFixed(2);applyRateToAmount()}else{r.value='0.00';amt.value='0.00';amt.dataset.manual='no';updateTotals()}
});
q.addEventListener('input',()=>{
if(amt.dataset.manual!=='yes'){amt.value=(num(q.value)*num(r.value)).toFixed(2)}
updateTotals();
});
r.addEventListener('input',applyRateToAmount);
amt.addEventListener('input',applyAmountToRate);
tr.querySelector('.line-remove').onclick=()=>{
if(body.children.length===1){sel.value='';q.value='';r.value='0.00';amt.value='0.00';amt.dataset.manual='no';updateTotals()}
else{tr.remove();updateTotals()}
};
if(itemId&&data.items.find(i=>i.id===itemId)){r.value=num(rate||data.items.find(i=>i.id===itemId).purchaseRate).toFixed(2)}
updateTotals();
}
if(draft&&Array.isArray(draft.rows)&&draft.rows.length){draft.rows.forEach(line=>{addLine(line.itemId||'',line.qty??'',line.rate??'');const row=body.lastElementChild,amount=row.querySelector('.line-amount-input');if(line.amount!==undefined&&line.amount!==''){amount.value=line.amount;amount.dataset.manual='yes';amount.dispatchEvent(new Event('input',{bubbles:true}))}})}else if(editVoucher){addLine(editVoucher.itemId,editVoucher.qty,editVoucher.rate)}else{addLine()}if(draft){form.elements.date.value=draft.date||today();form.elements.voucherNo.value=draft.voucherNo||suggested;form.elements.party.value=draft.party||'';form.elements.note.value=draft.note||''}const addedItemId=params.get('addedItemId'),returnRow=Math.max(0,Number(params.get('returnRow')||0));if(addedItemId&&data.items.some(i=>String(i.id)===addedItemId)){while(body.children.length<=returnRow)addLine();const target=body.children[returnRow].querySelector('.line-item');target.value=addedItemId;target.dispatchEvent(new Event('change',{bubbles:true}))}const addedAccountId=params.get('addedAccountId'),addedAccount=data.accounts.find(a=>String(a.id)===addedAccountId);if(addedAccount)$('purchaseParty').value=addedAccount.name;$('addPurchaseLine').onclick=()=>addLine();$('quickAddAccount').onclick=e=>{e.preventDefault();quickAddAccount()};$('closePurchaseForm').onclick=()=>{$('purchaseFormPanel').innerHTML=''};$('cancelPurchase').onclick=()=>{$('purchaseFormPanel').innerHTML=''};
form.onsubmit=e=>{e.preventDefault();$('purchaseError').textContent='';const lines=[...body.querySelectorAll('tr')].map(tr=>({item:data.items.find(i=>i.id===tr.querySelector('.line-item').value),qty:num(tr.querySelector('.line-qty').value),amount:num(tr.querySelector('.line-amount-input').value),rate:num(tr.querySelector('.line-rate').value)}));if(!lines.length||lines.some(l=>!l.item||l.qty<=0||l.amount<0||!Number.isFinite(l.amount))){$('purchaseError').textContent='Har row mein item, valid quantity aur amount bharein.';return}
const voucherNo=form.elements.voucherNo.value.trim();if(data.vouchers.some(v=>v.type==='IN'&&String(v.id)!==String(editVoucher?.id)&&String(v.voucherNo).toLowerCase()===voucherNo.toLowerCase())){$('purchaseError').textContent='Yeh purchase voucher number pehle se maujood hai. Unique number enter karein.';form.elements.voucherNo.focus();return}
const duplicateLines=new Set();for(const l of lines){if(duplicateLines.has(l.item.id)){/* duplicate item lines are allowed */}duplicateLines.add(l.item.id)}
const now=new Date().toISOString(),date=form.elements.date.value,party=form.elements.party.value.trim(),note=form.elements.note.value.trim();if(editVoucher){if(lines.length!==1){$('purchaseError').textContent='Ek existing purchase entry edit karte waqt sirf ek item row rakhein.';return}const l=lines[0];l.rate=l.amount/l.qty;const oldItem=data.items.find(i=>String(i.id)===String(editVoucher.itemId));if(oldItem)oldItem.qty=num(oldItem.qty)-num(editVoucher.qty);l.item.qty=num(l.item.qty)+l.qty;if(l.rate>0)l.item.purchaseRate=l.rate;Object.assign(editVoucher,{voucherNo,itemId:l.item.id,itemName:l.item.name,unit:l.item.unit||'pcs',qty:l.qty,rate:l.rate,date,party,note,updatedAt:now});}else{lines.forEach((l,index)=>{l.rate=l.amount/l.qty;l.item.qty=num(l.item.qty)+l.qty;if(l.rate>0)l.item.purchaseRate=l.rate;data.vouchers.push({id:'v_'+Date.now()+'_'+index+'_'+Math.random().toString(36).slice(2,6),voucherNo,type:'IN',itemId:l.item.id,itemName:l.item.name,unit:l.item.unit||'pcs',qty:l.qty,rate:l.rate,date,party,note,createdAt:now})})}try{save();render();$('purchaseFormPanel').innerHTML='<div class="notice">Purchase '+esc(voucherNo)+(editVoucher?' updated':' saved')+'. Stock quantity updated successfully.</div>';window.scrollTo({top:0,behavior:'smooth'})}catch(err){$('purchaseError').textContent='Save failed. Browser storage may be full or unavailable.'}}
}
function deletePurchaseLine(id){const v=data.vouchers.find(x=>String(x.id)===String(id)&&x.type==='IN');if(!v)return;const item=data.items.find(x=>String(x.id)===String(v.itemId));const label=(v.voucherNo||'Purchase')+' — '+(v.itemName||'item')+' (Qty '+num(v.qty)+')';if(!confirm('Delete purchase entry '+label+'? This will subtract its quantity from current stock. This action cannot be undone.'))return;if(item&&num(item.qty)<num(v.qty)){alert('Is purchase ko delete nahi kar sakte: current stock is purchase quantity se kam hai. Pehle related sale/stock entries ko correct karein.');return}if(item)item.qty=num(item.qty)-num(v.qty);data.vouchers=data.vouchers.filter(x=>String(x.id)!==String(id));try{save();render();$('purchaseFormPanel').innerHTML='<div class="notice">Purchase entry deleted and stock adjusted.</div>'}catch(e){alert('Delete failed; browser storage unavailable.')}}
function editPurchaseLine(id){showForm(id);}
function savePurchaseDraft(row){const form=$('purchaseForm');if(!form)return false;const rows=[...$('purchaseLineRows').querySelectorAll('tr')].map(tr=>({itemId:tr.querySelector('.line-item').value,qty:tr.querySelector('.line-qty').value,rate:tr.querySelector('.line-rate').value,amount:tr.querySelector('.line-amount-input').value}));const draft={date:form.elements.date.value,voucherNo:form.elements.voucherNo.value,party:form.elements.party.value,note:form.elements.note.value,rows,editId:activeEditId,returnRow:row?[...$('purchaseLineRows').children].indexOf(row):0};try{sessionStorage.setItem('myStorePurchaseDraft_'+company.id,JSON.stringify(draft))}catch(e){alert('Purchase form ka temporary data save nahi ho saka. Is tab ko band na karein.');return false}return true}
function quickAddAccount(){if(!savePurchaseDraft(null))return;location.href='add-account.html?companyId='+encodeURIComponent(company.id)+'&returnTo=purchase'}
function quickAddItem(row){if(!savePurchaseDraft(row))return;const index=[...$('purchaseLineRows').children].indexOf(row);location.href='add-item.html?companyId='+encodeURIComponent(company.id)+'&returnTo=purchase&returnRow='+Math.max(0,index)}
function exportCSV(){const rows=[['Date','Voucher No','Item','Supplier','Quantity','Unit','Rate','Amount','Narration'],...data.vouchers.filter(v=>v.type==='IN').map(v=>[v.date,v.voucherNo,v.itemName,v.party,v.qty,v.unit,v.rate,num(v.qty)*num(v.rate),v.note])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='purchase-register.csv';a.click();URL.revokeObjectURL(url)}
render();const draftKey='myStorePurchaseDraft_'+company.id;if(params.get('returnTo')==='purchase'){let draft=null;try{draft=JSON.parse(sessionStorage.getItem(draftKey)||'null')}catch{}try{sessionStorage.removeItem(draftKey)}catch{}if(draft){showForm(draft.editId||null,draft)}else if(params.get('addedItemId')||params.get('addedAccountId')){showForm()}if(params.get('addedItemId')){const rows=$('purchaseLineRows');if(rows){const index=Math.max(0,Number(params.get('returnRow')||0));while(rows.children.length<=index)$('addPurchaseLine').click();const sel=rows.children[index].querySelector('.line-item');if(sel){sel.value=params.get('addedItemId');sel.dispatchEvent(new Event('change',{bubbles:true}))}}}const aid=params.get('addedAccountId'),acc=data.accounts.find(a=>String(a.id)===aid);if(acc&&$('purchaseParty'))$('purchaseParty').value=acc.name}
})();
</script>
</body></html>
