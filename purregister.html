.company-invoice-head{display:flex;align-items:center;justify-content:center;gap:18px}.company-invoice-head>div{min-width:0}.company-invoice-logo{width:92px;height:92px;object-fit:contain;flex:0 0 auto}.invoice-title .company-invoice-head h1{font-size:25px;margin:0 0 6px}.invoice-title .company-invoice-head div{margin:3px 0;overflow-wrap:anywhere}.invoice-wrap{max-width:1000px;margin:0 auto}.invoice-paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;box-shadow:0 3px 12px #172b2010}.invoice-title{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:18px}.invoice-title h1{font-size:25px;margin:0 0 6px}.party-details{margin:16px auto 4px;max-width:760px;text-align:left;line-height:1.7}.party-details>strong{display:block;margin-bottom:4px}.invoice-meta{grid-template-columns:repeat(3,minmax(0,1fr));text-align:left}.invoice-meta div{padding:6px 0}.invoice-meta.below-items{grid-template-columns:1fr 2fr;margin-top:16px}.invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:18px 0}.invoice-meta div{padding:8px 0;border-bottom:1px solid var(--line)}.invoice-meta small{display:block;color:var(--muted);margin-bottom:4px}.invoice-table{width:100%;border-collapse:collapse;margin-top:20px}.invoice-table th,.invoice-table td{border:1px solid #dfe6df;padding:10px;text-align:left;font-size:13px}.invoice-table th{background:#edf8f3}.invoice-table .num{text-align:right;white-space:nowrap}.invoice-table tfoot .invoice-summary td{padding:13px 10px;background:#f4faf6;border-top:2px solid #a9cdb9;font-weight:700;white-space:nowrap}.invoice-table tfoot .invoice-summary .grand-label,.invoice-table tfoot .invoice-summary .grand-value{color:var(--green);font-weight:800}.invoice-table tfoot .invoice-summary .grand-value{font-size:15px}.invoice-footer{display:flex;justify-content:space-between;gap:20px;margin-top:50px}.sign{border-top:1px solid #9ba79d;padding-top:8px;width:200px;text-align:center;font-size:12px}.muted{color:var(--muted)}@media(max-width:600px){.company-invoice-head{gap:10px;align-items:flex-start}.company-invoice-logo{width:64px;height:64px}.invoice-paper{padding:14px}.invoice-meta{grid-template-columns:1fr}.invoice-table th,.invoice-table td{padding:6px;font-size:11px}.invoice-footer{margin-top:30px}}.purchase-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.purchase-grid .field{display:flex;flex-direction:column;gap:6px}.purchase-grid input,.purchase-grid select{padding:9px;border:1px solid var(--line);border-radius:7px;min-width:0;width:100%}.register-click-row:hover{background:#edf8f3}@media(max-width:650px){.purchase-grid{grid-template-columns:1fr 1fr}}@media print{body{background:#fff!important}.topbar,aside,.foot,.no-print{display:none!important}.layout{display:block!important;margin:0!important;padding:0!important}.invoice-wrap{max-width:none}.invoice-paper{box-shadow:none;border:0;padding:0;border-radius:0}.invoice-table th{background:#edf8f3!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}}

<script>
(()=>{'use strict';const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),companyId=p.get('companyId'),voucherNo=p.get('voucherNo'),companies=(()=>{try{return JSON.parse(localStorage.getItem('myStorePaliaCompaniesV1')||'[]')}catch{return []}})(),company=companies.find(c=>String(c.id)===String(companyId)),money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),num=n=>Number.isFinite(Number(n))?Number(n):0,esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!company){$('pageContent').innerHTML='<div class="panel"><div class="empty"><strong>Company select karein</strong><p><a class="btn primary" href="index.html">Dashboard par jayein</a></p></div></div>';return}let data={items:[],accounts:[],vouchers:[]};try{data=JSON.parse(localStorage.getItem('myStoreInventoryV1_'+company.id)||'{}')}catch{}$('companyName').textContent=company.name||'Company';const purchases=(Array.isArray(data.vouchers)?data.vouchers:[]).filter(v=>v.type==='IN');if(!voucherNo){const parties=[...new Set(purchases.map(v=>v.party||'').filter(Boolean))].sort();$('pageContent').innerHTML='<div class="heading no-print"><div><div class="eyebrow">STOCK IN · REPORT</div><h1>Purchase Register</h1><p>Party-wise and date-wise purchase report</p></div><div class="action-row"><a class="btn" href="purchase.html?companyId='+encodeURIComponent(company.id)+'">← Back to Purchase</a><button class="btn primary" id="printRegister">Print / Save PDF</button></div></div><div class="panel no-print"><div class="purchase-grid"><label class="field"><span>Party Name</span><select id="filterParty"><option value="">All Parties</option>'+parties.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></label><label class="field"><span>From Date</span><input id="filterFrom" type="date"></label><label class="field"><span>To Date</span><input id="filterTo" type="date"></label><label class="field"><span>Invoice No.</span><input id="filterInvoice" placeholder="Search invoice"></label></div></div><div class="panel"><div class="panel-head"><div><h2 id="registerHeading">Purchase Register — All Parties</h2><p id="registerSub">Select a row to open invoice details</p></div></div><div class="table-wrap"><table class="invoice-table"><thead><tr><th>Date</th><th>Inv No.</th><th>Party Name</th><th class="num">Credit Amount</th></tr></thead><tbody id="registerRows"></tbody><tfoot><tr><th colspan="3">Total Credit</th><th class="num" id="registerTotal">₹0.00</th></tr></tfoot></table></div><div class="muted" id="registerCount" style="padding:12px"></div></div>';const draw=()=>{const party=$('filterParty').value,from=$('filterFrom').value,to=$('filterTo').value,q=$('filterInvoice').value.trim().toLowerCase(),groups=new Map();purchases.forEach(v=>{const k=String(v.voucherNo||v.id);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(v)});const rows=[...groups.values()].map(vs=>({vs,v:vs[0],amount:vs.reduce((sum,x)=>sum+num(x.qty)*num(x.rate),0)})).filter(g=>(!party||g.vs.some(v=>(v.party||'')===party))&&(!from||(g.v.date||'')>=from)&&(!to||(g.v.date||'')<=to)&&(!q||String(g.v.voucherNo||'').toLowerCase().includes(q))).sort((a,b)=>(b.v.date||'').localeCompare(a.v.date||''));$('registerRows').innerHTML=rows.map(g=>'<tr class="register-click-row" tabindex="0" role="link" style="cursor:pointer" data-voucher="'+esc(g.v.voucherNo||'')+'"><td>'+esc(g.v.date||'—')+'</td><td>'+esc(g.v.voucherNo||'—')+'</td><td>'+esc(g.v.party||'—')+'</td><td class="num">'+money(g.amount)+'</td></tr>').join('');$('registerTotal').textContent=money(rows.reduce((sum,g)=>sum+g.amount,0));$('registerCount').textContent=rows.length+' invoice(s)';$('registerHeading').textContent='Purchase Register — '+(party||'All Parties');$('registerSub').textContent=(from||'Beginning')+' to '+(to||'Latest')+' · click a row to open invoice';document.querySelectorAll('.register-click-row').forEach(row=>{const open=()=>location.href='purregister.html?'+new URLSearchParams({companyId:company.id,voucherNo:row.dataset.voucher}).toString();row.onclick=open;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})};['filterParty','filterFrom','filterTo','filterInvoice'].forEach(id=>$(id).addEventListener('input',draw));$('printRegister').onclick=()=>window.print();draw();return}const all=purchases.filter(v=>String(v.voucherNo)===String(voucherNo)).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));if(!all.length){$('pageContent').innerHTML='<div class="panel"><div class="empty"><strong>Purchase invoice nahi mili</strong><p>Purchase register se invoice dobara kholein.</p><a class="btn primary" href="purchase.html?companyId='+encodeURIComponent(company.id)+'">Back to Purchase</a></div></div>';return}const first=all[0],total=all.reduce((sum,v)=>sum+num(v.qty)*num(v.rate),0),date=first.date||'—',formatDate=value=>{if(!value||value==='—')return '—';const parts=String(value).split('-');if(parts.length===3&&parts[0].length===4)return parts[2]+'-'+parts[1]+'-'+parts[0];return value},party=first.party||'—',partyAccount=(Array.isArray(data.accounts)?data.accounts:[]).find(a=>String(a.name||'').trim().toLowerCase()===String(party).trim().toLowerCase())||{};$('pageContent').innerHTML='<div class="heading no-print"><div><div class="eyebrow">PURCHASE · INVOICE</div><h1>Purchase Register</h1><p>Complete invoice details for '+esc(first.voucherNo)+'.</p></div><div class="action-row"><a class="btn" id="backRegister" href="purregister.html?companyId='+encodeURIComponent(company.id)+'">← Back to Purchase Register</a><button class="btn primary" id="printInvoice">Print / Save PDF</button></div></div><div class="invoice-wrap"><article class="invoice-paper"><div class="invoice-title"><div class="company-invoice-head">'+(company.logo?'<img class="company-invoice-logo" src="'+esc(company.logo)+'" alt="Company logo"> ':'')+'<div><h1>PURCHASE INVOICE</h1><strong>'+esc(company.name||'My Store')+'</strong><div>'+esc(company.businessType||'')+'</div><div>'+esc([company.address,company.city,company.state,company.pincode,company.country].filter(Boolean).join(', ')||'')+'</div><div>'+esc([company.phone,company.email].filter(Boolean).join(' · ')||'')+'</div><div>'+(company.gstin?'GSTIN: '+esc(company.gstin):'')+(company.pan?(company.gstin?' · ':'')+'PAN: '+esc(company.pan):'')+'</div><div class="muted">My Store By PaliaAPK HUB</div></div></div><div class="party-details"><strong>Supplier / Party: '+esc(party)+'</strong><div>Mobile: '+esc(partyAccount?.phone||partyAccount?.mobile||partyAccount?.mobileNo||'—')+'</div><div>Address: '+esc(partyAccount?.address||partyAccount?.billingAddress||'—')+'</div></div></div><table class="invoice-table"><thead><tr><th style="width:42px">Srl.</th><th>Inv.</th><th>Date</th><th>Item</th><th>Unit</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>'+all.map((v,i)=>'<tr><td>'+(i+1)+'</td><td>'+(i===0?esc(v.voucherNo||first.voucherNo):'')+'</td><td>'+(i===0?esc(formatDate(v.date||date)):'')+'</td><td><strong>'+esc(v.itemName||data.items?.find(x=>String(x.id)===String(v.itemId))?.name||'Item')+'</strong></td><td>'+esc(v.unit||'pcs')+'</td><td class="num">'+num(v.qty).toLocaleString('en-IN')+'</td><td class="num">'+money(v.rate)+'</td><td class="num">'+money(num(v.qty)*num(v.rate))+'</td></tr>').join('')+'</tbody><tfoot><tr class="invoice-summary"><td colspan="3"></td><td><strong>Total Items</strong></td><td></td><td class="num">'+all.reduce((sum,v)=>sum+num(v.qty),0).toLocaleString('en-IN')+'</td><td class="num grand-label">Grand Total</td><td class="num grand-value">'+money(total)+'</td></tr></tfoot></table><div class="invoice-footer"><div class="sign">Supplier Signature</div><div class="sign">Authorized Signature</div></div></article></div>';const leaveInvoice=()=>{if(confirm('Invoice se bahar nikal kar Purchase Register par jana hai?\n\nOK = Yes, Purchase Register par jayein\nCancel = No, invoice par rahein'))location.href='purregister.html?companyId='+encodeURIComponent(company.id)};$('backRegister').onclick=e=>{e.preventDefault();leaveInvoice()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();leaveInvoice()}});$('printInvoice').onclick=()=>window.print()})();
</script></body></html>
