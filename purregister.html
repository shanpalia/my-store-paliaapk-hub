<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126b4f"><title>Purchase Register | My Store By PaliaAPK HUB</title><link rel="stylesheet" href="page.css">
<style>
.invoice-wrap{max-width:1000px;margin:0 auto}.invoice-paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;box-shadow:0 3px 12px #172b2010}.invoice-title{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:18px}.invoice-title h1{font-size:25px;margin:0 0 6px}.invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:18px 0}.invoice-meta div{padding:8px 0;border-bottom:1px solid var(--line)}.invoice-meta small{display:block;color:var(--muted);margin-bottom:4px}.invoice-table{width:100%;border-collapse:collapse;margin-top:20px}.invoice-table th,.invoice-table td{border:1px solid #dfe6df;padding:10px;text-align:left;font-size:13px}.invoice-table th{background:#edf8f3}.invoice-table .num{text-align:right;white-space:nowrap}.invoice-total{display:flex;justify-content:flex-end;margin-top:16px}.invoice-total table{min-width:280px;border-collapse:collapse}.invoice-total td{padding:8px 12px;border-bottom:1px solid var(--line)}.invoice-total tr:last-child{font-weight:800;font-size:18px;color:var(--green)}.invoice-footer{display:flex;justify-content:space-between;gap:20px;margin-top:50px}.sign{border-top:1px solid #9ba79d;padding-top:8px;width:200px;text-align:center;font-size:12px}.muted{color:var(--muted)}@media(max-width:600px){.invoice-paper{padding:14px}.invoice-meta{grid-template-columns:1fr}.invoice-table th,.invoice-table td{padding:6px;font-size:11px}.invoice-footer{margin-top:30px}}.purchase-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.purchase-grid .field{display:flex;flex-direction:column;gap:6px}.purchase-grid input,.purchase-grid select{padding:9px;border:1px solid var(--line);border-radius:7px;min-width:0;width:100%}.register-click-row:hover{background:#edf8f3}@media(max-width:650px){.purchase-grid{grid-template-columns:1fr 1fr}}@media print{body{background:#fff!important}.topbar,aside,.foot,.no-print{display:none!important}.layout{display:block!important;margin:0!important;padding:0!important}.invoice-wrap{max-width:none}.invoice-paper{box-shadow:none;border:0;padding:0;border-radius:0}.invoice-table th{background:#edf8f3!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body data-page="purchase-register">
<header class="topbar"><a class="brand" href="index.html"><span class="logo">MS</span><span><strong>My Store By PaliaAPK HUB</strong><small>Inventory &amp; Accounts Workspace</small></span></a><div class="company">ACTIVE COMPANY<br><strong id="companyName">—</strong></div></header>
<div class="layout"><aside><div class="caption">WORKSPACE MENU</div><a class="nav" href="index.html"><span>▦</span>Dashboard</a><a class="nav" href="accounts.html"><span>₹</span>Accounts</a><a class="nav" href="items.html"><span>▤</span>Items</a><a class="nav active" href="purchase.html"><span>↓</span>Purchase</a><a class="nav" href="sale.html"><span>↑</span>Sale</a><a class="nav" href="balance.html"><span>≡</span>Balance</a><a class="nav" href="vouchers.html"><span>⇄</span>Vouchers</a><a class="nav" href="reports.html"><span>▥</span>Reports</a></aside>
<main id="pageContent"><div class="panel"><div class="empty">Loading purchase invoice…</div></div></main></div><footer class="foot">My Store By PaliaAPK HUB · Inventory data is stored in this browser.</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),companyId=p.get('companyId'),voucherNo=p.get('voucherNo'),companies=(()=>{try{return JSON.parse(localStorage.getItem('myStorePaliaCompaniesV1')||'[]')}catch{return []}})(),company=companies.find(c=>String(c.id)===String(companyId)),money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),num=n=>Number.isFinite(Number(n))?Number(n):0,esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!company){$('pageContent').innerHTML='<div class="panel"><div class="empty"><strong>Company select karein</strong><p><a class="btn primary" href="index.html">Dashboard par jayein</a></p></div></div>';return}let data={items:[],accounts:[],vouchers:[]};try{data=JSON.parse(localStorage.getItem('myStoreInventoryV1_'+company.id)||'{}')}catch{}$('companyName').textContent=company.name||'Company';const purchases=(Array.isArray(data.vouchers)?data.vouchers:[]).filter(v=>v.type==='IN');if(!voucherNo){const parties=[...new Set(purchases.map(v=>v.party||'').filter(Boolean))].sort();$('pageContent').innerHTML='<div class="heading no-print"><div><div class="eyebrow">STOCK IN · REPORT</div><h1>Purchase Register</h1><p>Party-wise and date-wise purchase report</p></div><div class="action-row"><a class="btn" href="purchase.html?companyId='+encodeURIComponent(company.id)+'">← Back to Purchase</a><button class="btn primary" id="printRegister">Print / Save PDF</button></div></div><div class="panel no-print"><div class="purchase-grid"><label class="field"><span>Party Name</span><select id="filterParty"><option value="">All Parties</option>'+parties.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></label><label class="field"><span>From Date</span><input id="filterFrom" type="date"></label><label class="field"><span>To Date</span><input id="filterTo" type="date"></label><label class="field"><span>Invoice No.</span><input id="filterInvoice" placeholder="Search invoice"></label></div></div><div class="panel"><div class="panel-head"><div><h2 id="registerHeading">Purchase Register — All Parties</h2><p id="registerSub">Select a row to open invoice details</p></div></div><div class="table-wrap"><table class="invoice-table"><thead><tr><th>Date</th><th>Inv No.</th><th>Party Name</th><th class="num">Credit Amount</th></tr></thead><tbody id="registerRows"></tbody><tfoot><tr><th colspan="3">Total Credit</th><th class="num" id="registerTotal">₹0.00</th></tr></tfoot></table></div><div class="muted" id="registerCount" style="padding:12px"></div></div>';const draw=()=>{const party=$('filterParty').value,from=$('filterFrom').value,to=$('filterTo').value,q=$('filterInvoice').value.trim().toLowerCase(),groups=new Map();purchases.forEach(v=>{const k=String(v.voucherNo||v.id);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(v)});const rows=[...groups.values()].map(vs=>({vs,v:vs[0],amount:vs.reduce((sum,x)=>sum+num(x.qty)*num(x.rate),0)})).filter(g=>(!party||g.vs.some(v=>(v.party||'')===party))&&(!from||(g.v.date||'')>=from)&&(!to||(g.v.date||'')<=to)&&(!q||String(g.v.voucherNo||'').toLowerCase().includes(q))).sort((a,b)=>(b.v.date||'').localeCompare(a.v.date||''));$('registerRows').innerHTML=rows.map(g=>'<tr class="register-click-row" tabindex="0" role="link" style="cursor:pointer" data-voucher="'+esc(g.v.voucherNo||'')+'"><td>'+esc(g.v.date||'—')+'</td><td>'+esc(g.v.voucherNo||'—')+'</td><td>'+esc(g.v.party||'—')+'</td><td class="num">'+money(g.amount)+'</td></tr>').join('');$('registerTotal').textContent=money(rows.reduce((sum,g)=>sum+g.amount,0));$('registerCount').textContent=rows.length+' invoice(s)';$('registerHeading').textContent='Purchase Register — '+(party||'All Parties');$('registerSub').textContent=(from||'Beginning')+' to '+(to||'Latest')+' · click a row to open invoice';document.querySelectorAll('.register-click-row').forEach(row=>{const open=()=>location.href='purregister.html?'+new URLSearchParams({companyId:company.id,voucherNo:row.dataset.voucher}).toString();row.onclick=open;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})};['filterParty','filterFrom','filterTo','filterInvoice'].forEach(id=>$(id).addEventListener('input',draw));$('printRegister').onclick=()=>window.print();draw();return}const all=purchases.filter(v=>String(v.voucherNo)===String(voucherNo)).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));if(!all.length){$('pageContent').innerHTML='<div class="panel"><div class="empty"><strong>Purchase invoice nahi mili</strong><p>Purchase register se invoice dobara kholein.</p><a class="btn primary" href="purchase.html?companyId='+encodeURIComponent(company.id)+'">Back to Purchase</a></div></div>';return}const first=all[0],total=all.reduce((sum,v)=>sum+num(v.qty)*num(v.rate),0),date=first.date||'—',party=first.party||'—',note=first.note||'—';$('pageContent').innerHTML='<div class="heading no-print"><div><div class="eyebrow">PURCHASE · INVOICE</div><h1>Purchase Register</h1><p>Complete invoice details for '+esc(first.voucherNo)+'.</p></div><div class="action-row"><a class="btn" href="purchase.html?companyId='+encodeURIComponent(company.id)+'">← Back to Purchase</a><button class="btn primary" id="printInvoice">Print / Save PDF</button></div></div><div class="invoice-wrap"><article class="invoice-paper"><div class="invoice-title"><h1>PURCHASE INVOICE</h1><strong>'+esc(company.name||'My Store')+'</strong><div class="muted">My Store By PaliaAPK HUB</div></div><div class="invoice-meta"><div><small>Voucher / Invoice No.</small><strong>'+esc(first.voucherNo)+'</strong></div><div><small>Purchase Date</small><strong>'+esc(date)+'</strong></div><div><small>Supplier / Party</small><strong>'+esc(party)+'</strong></div><div><small>Items in Invoice</small><strong>'+all.length+'</strong></div><div style="grid-column:1/-1"><small>Narration / Notes</small><strong>'+esc(note)+'</strong></div></div><table class="invoice-table"><thead><tr><th style="width:42px">S.No.</th><th>Item Description</th><th>Unit</th><th class="num">Quantity</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>'+all.map((v,i)=>'<tr><td>'+(i+1)+'</td><td><strong>'+esc(v.itemName||data.items?.find(x=>String(x.id)===String(v.itemId))?.name||'Item')+'</strong></td><td>'+esc(v.unit||'pcs')+'</td><td class="num">'+num(v.qty).toLocaleString('en-IN')+'</td><td class="num">'+money(v.rate)+'</td><td class="num">'+money(num(v.qty)*num(v.rate))+'</td></tr>').join('')+'</tbody></table><div class="invoice-total"><table><tr><td>Total Items</td><td class="num">'+all.length+'</td></tr><tr><td>Grand Total</td><td class="num">'+money(total)+'</td></tr></table></div><div class="invoice-footer"><div class="sign">Supplier Signature</div><div class="sign">Authorized Signature</div></div></article></div>';$('printInvoice').onclick=()=>window.print()})();
</script></body></html>
