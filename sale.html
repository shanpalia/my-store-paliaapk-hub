<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),companyKey='myStorePaliaCompaniesV1';
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>Number.isFinite(Number(n))?Number(n):0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let companies=[];try{companies=JSON.parse(localStorage.getItem(companyKey)||'[]')}catch{}

if(!company){$('pageContent').innerHTML='<div class="panel"><div class="empty"><strong>Company select karein</strong><p>Pehle Dashboard se company workspace kholein, phir Sale par aayein.</p><a class="btn primary" href="index.html">Open Company Selection</a></div></div>';return}

data.items=Array.isArray(data.items)?data.items:[];data.vouchers=Array.isArray(data.vouchers)?data.vouchers:[];data.accounts=Array.isArray(data.accounts)?data.accounts:[];

function voucherRows(list=data.vouchers.filter(v=>v.type==='OUT')){const groups=new Map();list.forEach(v=>{const key=String(v.voucherNo||v.id);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(v)});return [...groups.values()].map(rows=>{rows.sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));const v=rows[0],amount=rows.reduce((sum,x)=>sum+num(x.qty)*num(x.rate),0);return '<tr class="sale-register-row" tabindex="0" role="link" title="Open sale register" data-voucher="'+esc(v.voucherNo||'')+'"><td>'+esc(v.date||'—')+'</td><td>'+esc(v.voucherNo||'—')+'</td><td>'+esc(v.party||'—')+'</td><td class="money-cell">'+money(amount)+'</td></tr>'}).join('')}
function bindSaleActions(){document.querySelectorAll('#saleRows .sale-register-row').forEach(row=>{row.style.cursor='pointer';const open=()=>{const no=row.getAttribute('data-voucher');if(no)location.href='purregister.html?'+new URLSearchParams({companyId:company.id,voucherNo:no}).toString()};row.onclick=open;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
function render(){const saleVouchers=data.vouchers.filter(v=>v.type==='OUT');const total=saleVouchers.reduce((s,v)=>s+num(v.qty)*num(v.rate),0);
$('pageContent').innerHTML='<div class="heading"><div><div class="eyebrow">STOCK IN · VOUCHERS</div><h1>Sale</h1><p>Record customer sales and automatically update stock for '+esc(company.name)+'.</p></div><div class="action-row"><a class="btn" id="openSaleRegister" href="purregister.html?companyId='+encodeURIComponent(company.id)+'">Sale Register</a><button class="btn" id="exportSale">Export CSV</button><button class="btn primary" id="newSale">＋ New Sale</button></div></div><div class="stats"><div class="stat"><small>Sale Entries</small><strong>'+saleVouchers.length+'</strong></div><div class="stat"><small>Total Sale Value</small><strong>'+money(total)+'</strong></div><div class="stat"><small>Stock Items</small><strong>'+data.items.length+'</strong></div><div class="stat"><small>Customers / Accounts</small><strong>'+data.accounts.length+'</strong></div></div><div id="saleFormPanel"></div><div class="panel"><div class="panel-head"><div><h2>Sale Register</h2><p>Date · Invoice No. · Party · Credit Amount — select a row to open register</p></div><select id="salePartyFilter" aria-label="Filter by party" style="padding:9px;border:1px solid var(--line);border-radius:8px;max-width:220px"><option value="">All Parties</option>'+([...new Set(saleVouchers.map(v=>v.party||'').filter(Boolean))].sort().map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join(''))+'</select><input id="saleSearch" placeholder="Search invoice / party" style="padding:9px;border:1px solid var(--line);border-radius:8px;max-width:280px"></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Inv No.</th><th>Party Name</th><th>Credit Amount</th></tr></thead><tbody id="saleRows">'+voucherRows()+'</tbody></table></div><div id="saleEmpty" class="empty" style="display:'+(saleVouchers.length?'none':'block')+'"><strong>No sale entries yet</strong>Click “New Sale” to record the first sale.</div></div>';
$('newSale').onclick=()=>showForm();$('exportSale').onclick=exportCSV;bindSaleActions();const filterSaleRows=()=>{const q=$('saleSearch').value.toLowerCase(),party=$('salePartyFilter').value;const found=data.vouchers.filter(v=>v.type==='OUT'&&(!party||(v.party||'')===party)&&[v.date,v.voucherNo,v.itemName,v.party,v.note].join(' ').toLowerCase().includes(q));$('saleRows').innerHTML=voucherRows(found);$('saleEmpty').style.display=found.length?'none':'block';$('saleEmpty').innerHTML='<strong>No sale entries found</strong>Party ya search badal kar dekhein.';bindSaleActions()};$('saleSearch').addEventListener('input',filterSaleRows);$('salePartyFilter').addEventListener('change',filterSaleRows)}
let activeEditId=null;function showForm(editId=null,draft=null){activeEditId=editId;const editVoucher=editId?data.vouchers.find(x=>String(x.id)===String(editId)&&x.type==='OUT'):null;if(editId&&!editVoucher){alert('Sale entry nahi mili.');return}
const customers=data.accounts.filter(a=>/customer|creditor/i.test(a.group||''));
const accountOptions=data.accounts.map(a=>'<option value="'+esc(a.name)+'">'+esc(a.name)+(a.group?' · '+esc(a.group):'')+'</option>').join('');
const itemOptions=data.items.map(i=>'<option value="'+esc(i.id)+'">'+esc(i.name)+' · stock '+num(i.qty)+' '+esc(i.unit||'pcs')+'</option>').join('');
const suggested='SAL-'+String(data.vouchers.filter(v=>v.type==='OUT').length+1).padStart(5,'0');
$('saleFormPanel').innerHTML='<div class="panel"><div class="panel-head"><div><h2>'+(editVoucher?'Edit Sale Voucher':'New Sale Voucher')+'</h2><p>'+(editVoucher?'Sale details badlein aur Save Changes karein.':'Customer invoice details and one or more stock item lines.')+'</p></div><button class="btn" type="button" id="closeSaleForm">Close</button></div><form id="saleForm"><div class="sale-grid"><div class="field"><label for="saleDate">Date *</label><input id="saleDate" name="date" type="date" required value="'+esc(editVoucher?.date||today())+'"></div><div class="field"><label for="saleNo">Voucher / Invoice No. *</label><input id="saleNo" name="voucherNo" required maxlength="50" value="'+esc(editVoucher?.voucherNo||suggested)+'"></div><div class="field field-with-add"><div><label for="saleParty">Customer / Party</label><input id="saleParty" name="party" list="customerOptions" maxlength="120" placeholder="Type or select customer" value="'+esc(editVoucher?.party||'')+'"><datalist id="customerOptions">'+accountOptions+'</datalist></div><button class="plus-btn" type="button" id="quickAddAccount" title="Add account" aria-label="Add account">+</button></div><div class="field"><label for="saleNote">Narration</label><input id="saleNote" name="note" maxlength="250" placeholder="Invoice note / details" value="'+esc(editVoucher?.note||'')+'"></div></div><div class="panel-head" style="margin-top:24px"><div><h2>Inventory Items</h2><p>Inventory se item select karein; available stock, quantity, rate aur amount yahan dikhenge.</p></div></div><div class="sale-lines" style="margin-top:10px"><table><thead><tr><th style="width:32%">Item * <span class="muted">(+ to add)</span></th><th>Available Qty</th><th style="width:14%">Quantity *</th><th style="width:17%">Rate (₹) Auto</th><th style="width:19%">Amount (₹) *</th><th></th></tr></thead><tbody id="saleLineRows"></tbody></table></div><div class="action-row" style="margin-top:12px"><button class="btn" type="button" id="addSaleLine">＋ Add Item Row</button></div><div class="sale-summary"><span>Total Sale</span><strong id="saleGrandTotal">₹0.00</strong></div><div class="error" id="saleError" role="alert"></div><div class="action-row"><button class="btn" type="button" id="cancelSale">Cancel</button><button class="btn primary" type="submit">'+(editVoucher?'Save Changes':'Save Sale')+'</button></div></form></div>';
const form=$('saleForm'),body=$('saleLineRows');
function addLine(itemId='',qty='',rate=''){
const initialAmount=(num(qty)*num(rate)).toFixed(2);
const tr=document.createElement('tr');
tr.innerHTML='<td><div class="field-with-add"><div><select class="line-item" required><option value="">Select item</option>'+itemOptions+'</select></div><button type="button" class="plus-btn quick-add-item" title="Add item" aria-label="Add item">+</button></div></td><td class="line-stock">—</td><td><input class="line-qty" type="number" min="0.001" step="any" required value="'+qty+'" placeholder="Qty"></td><td><input class="line-rate" type="number" min="0" step="0.01" required value="'+rate+'" placeholder="Enter rate" aria-label="Rate"></td><td><input class="line-amount-input" type="number" min="0" step="0.01" required value="'+initialAmount+'" placeholder="Enter amount"></td><td><button type="button" class="btn line-remove" aria-label="Remove row">×</button></td>';
body.appendChild(tr);
tr.querySelector('.quick-add-item').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();quickAddItem(tr)});
const sel=tr.querySelector('.line-item'),q=tr.querySelector('.line-qty'),r=tr.querySelector('.line-rate'),amt=tr.querySelector('.line-amount-input');
amt.dataset.manual='no';
if(itemId)sel.value=itemId;
function updateTotals(){
const item=data.items.find(i=>i.id===sel.value);
tr.querySelector('.line-stock').textContent=item?num(item.qty)+' '+(item.unit||'pcs'):'—';
const quantity=num(q.value),amount=num(amt.value);
if(amt.dataset.manual==='yes'){r.value=quantity>0?(amount/quantity).toFixed(2):'0.00'}else if(quantity>0){r.value=(amount/quantity).toFixed(2)}
let total=0;
body.querySelectorAll('tr').forEach(row=>total+=num(row.querySelector('.line-amount-input').value));
$('saleGrandTotal').textContent=money(total);
}
function applyRateToAmount(){
const quantity=num(q.value),currentRate=num(r.value);
amt.dataset.manual='no';
amt.value=(quantity*currentRate).toFixed(2);
updateTotals();
}
function applyAmountToRate(){
amt.dataset.manual='yes';
updateTotals();
}
sel.addEventListener('change',()=>{
const item=data.items.find(i=>i.id===sel.value);
if(item){r.value=num(item.saleRate).toFixed(2);applyRateToAmount()}else{r.value='0.00';amt.value='0.00';amt.dataset.manual='no';updateTotals()}
});
q.addEventListener('input',()=>{
if(amt.dataset.manual!=='yes'){amt.value=(num(q.value)*num(r.value)).toFixed(2)}
updateTotals();
});
r.addEventListener('input',applyRateToAmount);
amt.addEventListener('input',applyAmountToRate);
tr.querySelector('.line-remove').onclick=()=>{
if(body.children.length===1){sel.value='';q.value='';r.value='0.00';amt.value='0.00';amt.dataset.manual='no';updateTotals()}
else{tr.remove();updateTotals()}
};
if(itemId&&data.items.find(i=>i.id===itemId)){r.value=num(rate||data.items.find(i=>i.id===itemId).saleRate).toFixed(2)}
updateTotals();
}
if(editVoucher){addLine(editVoucher.itemId,editVoucher.qty,editVoucher.rate)}else if(draft&&Array.isArray(draft.rows)&&draft.rows.length){draft.rows.forEach(line=>{addLine(line.itemId||'',line.qty??'',line.rate??'');const row=body.lastElementChild,amount=row.querySelector('.line-amount-input');if(line.amount!==undefined&&line.amount!==''){amount.value=line.amount;amount.dataset.manual='yes';amount.dispatchEvent(new Event('input',{bubbles:true}))}})}else{addLine()}if(draft){form.elements.date.value=draft.date||today();form.elements.voucherNo.value=draft.voucherNo||suggested;form.elements.party.value=draft.party||'';form.elements.note.value=draft.note||''}const addedItemId=params.get('addedItemId'),returnRow=Math.max(0,Number(params.get('returnRow')||0));if(addedItemId&&data.items.some(i=>String(i.id)===addedItemId)){while(body.children.length<=returnRow)addLine();const target=body.children[returnRow].querySelector('.line-item');target.value=addedItemId;target.dispatchEvent(new Event('change',{bubbles:true}))}const addedAccountId=params.get('addedAccountId'),addedAccount=data.accounts.find(a=>String(a.id)===addedAccountId);if(addedAccount)$('saleParty').value=addedAccount.name;$('addSaleLine').onclick=()=>addLine();$('quickAddAccount').onclick=e=>{e.preventDefault();quickAddAccount()};$('closeSaleForm').onclick=()=>{$('saleFormPanel').innerHTML=''};$('cancelSale').onclick=()=>{$('saleFormPanel').innerHTML=''};
form.onsubmit=e=>{e.preventDefault();$('saleError').textContent='';const lines=[...body.querySelectorAll('tr')].map(tr=>({item:data.items.find(i=>i.id===tr.querySelector('.line-item').value),qty:num(tr.querySelector('.line-qty').value),amount:num(tr.querySelector('.line-amount-input').value),rate:num(tr.querySelector('.line-rate').value)}));if(!lines.length||lines.some(l=>!l.item||l.qty<=0||l.amount<0||!Number.isFinite(l.amount))){$('saleError').textContent='Har row mein item, valid quantity aur amount bharein.';return}
const voucherNo=form.elements.voucherNo.value.trim();if(data.vouchers.some(v=>v.type==='OUT'&&String(v.id)!==String(editVoucher?.id)&&String(v.voucherNo).toLowerCase()===voucherNo.toLowerCase())){$('saleError').textContent='Yeh sale voucher number pehle se maujood hai. Unique number enter karein.';form.elements.voucherNo.focus();return}
const duplicateLines=new Set();for(const l of lines){if(duplicateLines.has(l.item.id)){/* duplicate item lines are allowed */}duplicateLines.add(l.item.id)}
const now=new Date().toISOString(),date=form.elements.date.value,party=form.elements.party.value.trim(),note=form.elements.note.value.trim();if(editVoucher){const oldItem=data.items.find(i=>String(i.id)===String(editVoucher.itemId));if(oldItem)oldItem.qty=num(oldItem.qty)-num(editVoucher.qty);const first=lines[0];first.rate=first.amount/first.qty;if(num(first.item.qty)<first.qty){$('saleError').textContent='Available stock sirf '+num(first.item.qty)+' '+(first.item.unit||'pcs')+' hai.';return}first.item.qty=num(first.item.qty)-first.qty;if(first.rate>0)first.item.saleRate=first.rate;Object.assign(editVoucher,{voucherNo,type:'OUT',itemId:first.item.id,itemName:first.item.name,unit:first.item.unit||'pcs',qty:first.qty,rate:first.rate,date,party,note,updatedAt:now});for(let index=1;index<lines.length;index++){const l=lines[index];l.rate=l.amount/l.qty;if(num(l.item.qty)<l.qty){$('saleError').textContent='Item '+l.item.name+' ka available stock sirf '+num(l.item.qty)+' '+(l.item.unit||'pcs')+' hai.';return}l.item.qty=num(l.item.qty)-l.qty;if(l.rate>0)l.item.saleRate=l.rate;data.vouchers.push({id:'v_'+Date.now()+'_'+index+'_'+Math.random().toString(36).slice(2,6),voucherNo,type:'OUT',itemId:l.item.id,itemName:l.item.name,unit:l.item.unit||'pcs',qty:l.qty,rate:l.rate,date,party,note,createdAt:now,updatedAt:now})}}else{lines.forEach((l,index)=>{l.rate=l.amount/l.qty;if(num(l.item.qty)<l.qty){$('saleError').textContent='Item '+l.item.name+' ka available stock sirf '+num(l.item.qty)+' '+(l.item.unit||'pcs')+' hai.';return}l.item.qty=num(l.item.qty)-l.qty;if(l.rate>0)l.item.saleRate=l.rate;data.vouchers.push({id:'v_'+Date.now()+'_'+index+'_'+Math.random().toString(36).slice(2,6),voucherNo,type:'OUT',itemId:l.item.id,itemName:l.item.name,unit:l.item.unit||'pcs',qty:l.qty,rate:l.rate,date,party,note,createdAt:now})})}try{save();render();$('saleFormPanel').innerHTML='<div class="notice">Sale '+esc(voucherNo)+(editVoucher?' updated':' saved')+'. Stock quantity updated successfully.</div>';window.scrollTo({top:0,behavior:'smooth'})}catch(err){$('saleError').textContent='Save failed. Browser storage may be full or unavailable.'}}
}
function deleteSaleLine(id){const v=data.vouchers.find(x=>String(x.id)===String(id)&&x.type==='OUT');if(!v)return;const item=data.items.find(x=>String(x.id)===String(v.itemId));const label=(v.voucherNo||'Sale')+' — '+(v.itemName||'item')+' (Qty '+num(v.qty)+')';if(!confirm('Delete sale entry '+label+'? This will subtract its quantity from current stock. This action cannot be undone.'))return;if(item&&num(item.qty)<num(v.qty)){alert('Is sale ko delete nahi kar sakte: current stock is sale quantity se kam hai. Pehle related sale/stock entries ko correct karein.');return}if(item)item.qty=num(item.qty)+num(v.qty);data.vouchers=data.vouchers.filter(x=>String(x.id)!==String(id));try{save();render();$('saleFormPanel').innerHTML='<div class="notice">Sale entry deleted and stock adjusted.</div>'}catch(e){alert('Delete failed; browser storage unavailable.')}}
function editSaleLine(id){showForm(id);}
function saveSaleDraft(row){const form=$('saleForm');if(!form)return false;const rows=[...$('saleLineRows').querySelectorAll('tr')].map(tr=>({itemId:tr.querySelector('.line-item').value,qty:tr.querySelector('.line-qty').value,rate:tr.querySelector('.line-rate').value,amount:tr.querySelector('.line-amount-input').value}));const draft={date:form.elements.date.value,voucherNo:form.elements.voucherNo.value,party:form.elements.party.value,note:form.elements.note.value,rows,editId:activeEditId,returnRow:row?[...$('saleLineRows').children].indexOf(row):0};try{sessionStorage.setItem('myStoreSaleDraft_'+company.id,JSON.stringify(draft))}catch(e){alert('Sale form ka temporary data save nahi ho saka. Is tab ko band na karein.');return false}return true}
function inlineMasterForm(kind,row){
const existing=$('inlineMasterModal');if(existing)existing.remove();
const isItem=kind==='item',wrap=document.createElement('div');wrap.id='inlineMasterModal';wrap.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
wrap.innerHTML='<div class="panel" style="width:min(560px,100%);max-height:90vh;overflow:auto;background:white"><div class="panel-head"><div><h2>'+(isItem?'Add Item':'Add Party')+'</h2><p>Invoice form se hi save karein.</p></div><button type="button" class="btn" id="inlineMasterClose">Close</button></div><form id="inlineMasterForm" class="form">'+(isItem?'<div class="field"><label>Item Name *</label><input name="name" required maxlength="120"></div><div class="field"><label>Category *</label><input name="category" required value="Grocery" list="inlineItemCats"></div><datalist id="inlineItemCats"><option value="Grocery"><option value="Food & Beverage"><option value="Dairy"><option value="Fresh Produce"><option value="Stationery"><option value="Office Supplies"><option value="Electronics"><option value="Mobile Accessories"><option value="Home Care"><option value="Personal Care"><option value="Cosmetics"><option value="Clothing"><option value="Footwear"><option value="Toys"><option value="Kitchenware"><option value="Hardware"><option value="Building Materials"><option value="Automotive"><option value="Medical Supplies"><option value="Agriculture"><option value="Pet Supplies"><option value="Other"></datalist><div class="field"><label>Unit *</label><input name="unit" required value="pcs" list="inlineItemUnits"></div><datalist id="inlineItemUnits"><option value="pcs"><option value="kg"><option value="litre"><option value="box"><option value="pack"></datalist><div class="field"><label>Opening Stock Qty</label><input name="qty" type="number" min="0" step="any" value="0"></div><div class="field"><label>Purchase Rate (₹)</label><input name="purchaseRate" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Sale Rate (₹)</label><input name="saleRate" type="number" min="0" step=".01" value="0"></div>':'<div class="field"><label>Party Name *</label><input name="name" required maxlength="120"></div><div class="field"><label>Group *</label><input name="group" required list="inlinePartyGroups" value="Sundry Debtors"></div><datalist id="inlinePartyGroups"><option value="Sundry Debtors"><option value="Sundry Creditors"><option value="Cash-in-Hand"><option value="Bank Accounts"><option value="Other Current Assets"></datalist><div class="field"><label>Phone</label><input name="phone" maxlength="30"></div><div class="field"><label>Opening Balance (₹)</label><input name="openingBalance" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Balance Type</label><select name="balanceType"><option value="Dr">Dr</option><option value="Cr">Cr</option></select></div>')+'<div class="field full" id="inlineMasterError" style="color:#b0473e"></div><div class="field full form-actions"><button type="button" class="btn" id="inlineMasterCancel">Cancel</button><button type="submit" class="btn primary">Save and Select</button></div></form></div>';
document.body.appendChild(wrap);const close=()=>wrap.remove();$('inlineMasterClose').onclick=close;$('inlineMasterCancel').onclick=close;
$('inlineMasterForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,name=f.elements.name.value.trim();if(!name)return;
if(isItem){if(data.items.some(x=>x.name.toLowerCase()===name.toLowerCase())){$('inlineMasterError').textContent='Is naam ka item pehle se hai.';return}
const qty=num(f.elements.qty.value),item={id:'itm_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name,sku:'',category:f.elements.category.value.trim()||'Other',unit:f.elements.unit.value.trim()||'pcs',minQty:0,purchaseRate:num(f.elements.purchaseRate.value),saleRate:num(f.elements.saleRate.value),qty,createdAt:new Date().toISOString()};
data.items.push(item);if(qty>0)data.vouchers.push({id:'v_'+Date.now(),voucherNo:'OPEN-'+Date.now(),type:'IN',itemId:item.id,itemName:item.name,unit:item.unit,qty,rate:item.purchaseRate,date:today(),party:'Opening Stock',note:'Opening stock',createdAt:new Date().toISOString()});
try{save()}catch(err){data.items.pop();$('inlineMasterError').textContent='Save failed. Browser storage available hai ya nahi check karein.';return}
document.querySelectorAll('.line-item').forEach(sel=>{const opt=document.createElement('option');opt.value=item.id;opt.textContent=item.name+' · stock '+num(item.qty)+' '+item.unit;sel.appendChild(opt)});if(row){const sel=row.querySelector('.line-item');sel.value=item.id;sel.dispatchEvent(new Event('change',{bubbles:true}))}
}else{if(data.accounts.some(x=>x.name.toLowerCase()===name.toLowerCase())){$('inlineMasterError').textContent='Is naam ki party pehle se hai.';return}
const account={id:'acc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name,group:f.elements.group.value.trim(),phone:f.elements.phone.value.trim(),openingBalance:num(f.elements.openingBalance.value),balanceType:f.elements.balanceType.value,createdAt:new Date().toISOString()};data.accounts.push(account);
try{save()}catch(err){data.accounts.pop();$('inlineMasterError').textContent='Save failed. Browser storage available hai ya nahi check karein.';return}
const list=$('customerOptions');if(list){const opt=document.createElement('option');opt.value=account.name;opt.textContent=account.name+' · '+account.group;list.appendChild(opt)}$('saleParty').value=account.name}
close();};}

function exportCSV(){const rows=[['Date','Voucher No','Item','Customer','Quantity','Unit','Rate','Amount','Narration'],...data.vouchers.filter(v=>v.type==='OUT').map(v=>[v.date,v.voucherNo,v.itemName,v.party,v.qty,v.unit,v.rate,num(v.qty)*num(v.rate),v.note])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sale-register.csv';a.click();URL.revokeObjectURL(url)}
render();if(params.get('returnTo')!=='sale'){const stats=document.querySelector('#pageContent .stats');if(stats)stats.remove();const registerPanel=[...document.querySelectorAll('#pageContent > .panel')].find(p=>p.querySelector('#saleRows'));if(registerPanel)registerPanel.remove();const headingActions=document.querySelector('#pageContent .heading .action-row');if(headingActions)headingActions.remove();showForm()}const draftKey='myStoreSaleDraft_'+company.id;if(params.get('returnTo')==='sale'){let draft=null;try{draft=JSON.parse(sessionStorage.getItem(draftKey)||'null')}catch{}try{sessionStorage.removeItem(draftKey)}catch{}if(draft){showForm(draft.editId||null,draft)}else if(params.get('addedItemId')||params.get('addedAccountId')){showForm()}if(params.get('addedItemId')){const rows=$('saleLineRows');if(rows){const index=Math.max(0,Number(params.get('returnRow')||0));while(rows.children.length<=index)$('addSaleLine').click();const sel=rows.children[index].querySelector('.line-item');if(sel){sel.value=params.get('addedItemId');sel.dispatchEvent(new Event('change',{bubbles:true}))}}}const aid=params.get('addedAccountId'),acc=data.accounts.find(a=>String(a.id)===aid);if(acc&&$('saleParty'))$('saleParty').value=acc.name}
})();
